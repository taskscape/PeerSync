name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep every main push, including queued runs. Only superseded PR runs share a group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  version:
    name: Require a version increase for every main commit
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the shared version and main commit increases
        shell: pwsh
        env:
          MAIN_BEFORE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before || '' }}
        run: ./build/Test-VersionBump.ps1 -BaseRef $env:MAIN_BEFORE
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test and publish
        shell: pwsh
        run: |
          $skip = '${{ matrix.runtime }}' -eq 'win-arm64'
          # Server 2022 runs the full Engine suite; Server 2025 omits only
          # the duplicate generic 1,001-conflict capacity stress method.
          # The boundary job owns the complete Simulation suite alongside fuzz.
          ./build/Verify.ps1 -Runtime '${{ matrix.runtime }}' -SkipRuntimeChecks:$skip -SkipEngineTests -SkipSimulation -SkipFuzz
      - name: Sign and verify a test EXE with a temporary development identity
        shell: pwsh
        run: ./build/Test-Signing.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.runtime }}
          path: |
            artifacts/verification-*.json
            artifacts/environment-*.json
            artifacts/tests/
            artifacts/simulation/
            artifacts/p0/
            artifacts/fuzz/
            artifacts/signing/
            artifacts/clock-ui/
      - name: Upload P0 probe bundle (not the product)
        uses: actions/upload-artifact@v7
        with:
          name: PeerSync-P0-probes-${{ matrix.runtime }}
          path: artifacts/publish/${{ matrix.runtime }}/
          retention-days: 7
  fuzz-smoke:
    runs-on: windows-latest
    # Fuzz and the seven baseline methods share this runner. Three retained
    # cohorts run on separate hosted runners to avoid fixture I/O contention.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Campaign planner and simulation evidence controls
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'campaign_*_test.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Campaign controls failed' }
          ./build/Test-SimulationScope.ps1
          ./build/Test-BoundaryCiArtifacts.ps1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Required ten-minute boundary fuzz and baseline simulations
        shell: pwsh
        run: ./build/Run-BoundarySimulation.ps1 -FuzzSeconds 600 -Cohort baseline
      - name: Boundary supervisor budget and owned cleanup controls
        shell: pwsh
        run: ./build/Test-BoundaryRunner.ps1
      - name: Upload baseline scope for aggregate verification
        uses: actions/upload-artifact@v7
        with:
          name: boundary-baseline-attempt-${{ github.run_attempt }}
          path: artifacts/boundary-shards/baseline/
          if-no-files-found: error
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-evidence-attempt-${{ github.run_attempt }}
          path: |
            artifacts/fuzz/
            artifacts/simulation/
            artifacts/tests/simulation/
  retained-simulation:
    strategy:
      fail-fast: false
      matrix:
        cohort: [retained-1, retained-2, retained-3]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run exact retained Simulation cohort
        shell: pwsh
        run: ./build/Run-BoundarySimulation.ps1 -Cohort '${{ matrix.cohort }}'
      - name: Upload retained scope for aggregate verification
        uses: actions/upload-artifact@v7
        with:
          name: boundary-${{ matrix.cohort }}-attempt-${{ github.run_attempt }}
          path: artifacts/boundary-shards/${{ matrix.cohort }}/
          if-no-files-found: error
      - name: Upload retained failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-${{ matrix.cohort }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            artifacts/fuzz/
            artifacts/simulation/
            artifacts/tests/simulation/
  boundary-aggregate:
    needs: [fuzz-smoke, retained-simulation]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: boundary-*-attempt-${{ github.run_attempt }}
          path: artifacts/boundary-ci/
      - name: Verify all fifteen Simulation methods and ten-minute fuzz
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify aggregate source revision' }
          ./build/Read-BoundaryCiArtifacts.ps1 -Path artifacts/boundary-ci `
            -RunId "$env:GITHUB_RUN_ID" -RunAttempt "$env:GITHUB_RUN_ATTEMPT" `
            -SourceRevision $source | ConvertTo-Json -Depth 5 |
            Set-Content artifacts/boundary-ci-summary.json
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boundary-aggregate-attempt-${{ github.run_attempt }}
          path: artifacts/boundary-ci-summary.json
  service-security:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            timeoutMinutes: 15
            verificationBudgetSeconds: 840
          - os: windows-2025
            timeoutMinutes: 25
            verificationBudgetSeconds: 1440
    runs-on: ${{ matrix.os }}
    # Each entry reserves one minute for setup, upload and owned cleanup.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Virtual-account and standard-user security checks
        shell: pwsh
        run: ./build/Verify-ServiceSecurity.ps1 -SkipCaseCapacityStress:('${{ matrix.os }}' -eq 'windows-2025') -VerificationBudgetSeconds ${{ matrix.verificationBudgetSeconds }}
      - name: Upload service security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-security-evidence-${{ matrix.os }}
          path: |
            artifacts/p0-services/
            artifacts/p0/
            artifacts/tests/native-engine/
  installer:
    name: Client and optional Windows Server installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify WER exclusion ownership controls
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Test-WerPolicy.ps1
          if ($LASTEXITCODE -ne 0) { throw "WER policy controls failed ($LASTEXITCODE)." }
      - name: Verify read-only crash policy audit
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Test-CrashPolicyAudit.ps1
          if ($LASTEXITCODE -ne 0) { throw "Crash policy audit failed ($LASTEXITCODE)." }
      - name: Verify update publisher rotation guard
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Test-UpdatePolicyRotation.ps1
          if ($LASTEXITCODE -ne 0) { throw "Update publisher rotation guard failed ($LASTEXITCODE)." }
      - name: Verify update restart recovery guard
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Test-UpdateRestartRecovery.ps1
          if ($LASTEXITCODE -ne 0) { throw "Update restart recovery guard failed ($LASTEXITCODE)." }
      - name: Build and verify signed development installers
        shell: pwsh
        run: ./build/Run-InstallerCi.ps1
      - name: Upload Windows x64 client installer
        uses: actions/upload-artifact@v7
        with:
          name: PeerSync-client-win-x64-${{ github.sha }}
          path: artifacts/installer/PeerSync-Setup-*-x64.exe*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Windows Arm64 client installer
        uses: actions/upload-artifact@v7
        with:
          name: PeerSync-client-win-arm64-${{ github.sha }}
          path: artifacts/installer/PeerSync-Setup-*-arm64.exe*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload optional Windows Server Rendezvous installer
        uses: actions/upload-artifact@v7
        with:
          name: PeerSync-rendezvous-win-x64-${{ github.sha }}
          path: artifacts/installer/PeerSync-Rendezvous-Setup-*-x64.exe*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload installer build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-evidence
          path: artifacts/installer/*.manifest.json
          if-no-files-found: warn
  release:
    name: Publish development prerelease
    needs: [version, build, fuzz-smoke, retained-simulation, boundary-aggregate, service-security, installer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: PeerSync-*-win-*-${{ github.sha }}
          path: artifacts/release/
          merge-multiple: true
      - name: Validate assets and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ./build/Get-Version.ps1
          $fileVersion = ./build/Get-Version.ps1 -FileVersion
          $assets = @()
          foreach ($name in @("PeerSync-Setup-$fileVersion-x64.exe",
              "PeerSync-Setup-$fileVersion-arm64.exe", "PeerSync-Rendezvous-Setup-$fileVersion-x64.exe")) {
            $setup = Join-Path 'artifacts/release' $name
            foreach ($file in @($setup, "$setup.manifest.json", "$setup.cer")) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
              $assets += $file
            }
            $manifest = Get-Content -LiteralPath "$setup.manifest.json" -Raw | ConvertFrom-Json
            if ($manifest.version -ne $fileVersion -or
                $manifest.sourceRevision -ne $env:GITHUB_SHA -or $manifest.workingTreeDirty -ne $false -or
                $manifest.signed -ne $true -or $manifest.localDevelopmentOnly -ne $true -or
                $manifest.installerSha256 -ne (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash) {
              throw "Release asset does not match this signed development build: $name"
            }
          }
          $tag = "build-$env:GITHUB_SHA"
          $title = "PeerSync $version development build $($env:GITHUB_SHA.Substring(0, 12))"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          @"
          Experimental development packages from main at commit $env:GITHUB_SHA.

          These installers use a temporary development signing certificate. The public
          certificates and source/hash manifests are attached alongside each installer.
          LAN/WAN beta and v1.0 release acceptance gates remain open.

          Verified CI run: $runUrl (attempt $env:GITHUB_RUN_ATTEMPT).
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Output "Prerelease $tag is already published."
              exit 0
            }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title $title --notes-file release-notes.md --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft prerelease.' }
          }
          & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all prerelease assets.' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title `
            --notes-file release-notes.md --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the prerelease.' }
