name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test and publish
        shell: pwsh
        run: |
          $skip = '${{ matrix.runtime }}' -eq 'win-arm64'
          # Server 2022 runs the full Engine suite; Server 2025 omits only
          # the duplicate generic 1,001-conflict capacity stress method.
          # The boundary job owns the complete Simulation suite alongside fuzz.
          ./build/Verify.ps1 -Runtime '${{ matrix.runtime }}' -SkipRuntimeChecks:$skip -SkipEngineTests -SkipSimulation -SkipFuzz
      - name: Sign and verify a test EXE with a temporary development identity
        shell: pwsh
        run: ./build/Test-Signing.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.runtime }}
          path: |
            artifacts/verification-*.json
            artifacts/environment-*.json
            artifacts/tests/
            artifacts/simulation/
            artifacts/p0/
            artifacts/fuzz/
            artifacts/signing/
            artifacts/clock-ui/
      - name: Upload P0 probe bundle (not the product)
        uses: actions/upload-artifact@v7
        with:
          name: PeerSync-P0-probes-${{ matrix.runtime }}
          path: artifacts/publish/${{ matrix.runtime }}/
          retention-days: 7
  fuzz-smoke:
    runs-on: windows-latest
    # Two bounded cohorts retain all fifteen Simulation methods and overlap
    # independent IO with the required ten-minute CPU boundary fuzz.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Campaign planner and simulation evidence controls
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'campaign_*_test.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Campaign controls failed' }
          ./build/Test-SimulationScope.ps1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Required ten-minute boundary fuzz and real-engine simulations
        shell: pwsh
        run: ./build/Run-BoundarySimulation.ps1 -FuzzSeconds 600
      - name: Boundary supervisor budget and owned cleanup controls
        shell: pwsh
        run: ./build/Test-BoundaryRunner.ps1
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-evidence
          path: |
            artifacts/fuzz/
            artifacts/simulation/
            artifacts/tests/simulation/
  service-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # Native flush/restart tests plus setup and evidence/runner cleanup exceeded
    # ten minutes on Server 2025 even though every test/step passed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Virtual-account and standard-user security checks
        shell: pwsh
        run: ./build/Verify-ServiceSecurity.ps1 -SkipCaseCapacityStress:('${{ matrix.os }}' -eq 'windows-2025')
      - name: Upload service security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-security-evidence-${{ matrix.os }}
          path: |
            artifacts/p0-services/
            artifacts/p0/
            artifacts/tests/native-engine/
