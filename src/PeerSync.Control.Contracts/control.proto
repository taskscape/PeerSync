syntax = "proto3";
package peersync.control.v1;
option csharp_namespace = "PeerSync.Control.Contracts.V1";

service PeerSyncControl {
  rpc GetStatus(StatusRequest) returns (ServiceStatus);
  rpc WatchEvents(StatusRequest) returns (stream ControlEvent);
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse);
  rpc SetPredefinedHosts(SetPredefinedHostsRequest) returns (SetPredefinedHostsResponse);
  rpc AddFolder(AddFolderRequest) returns (FolderInfo);
  rpc JoinFolder(JoinFolderRequest) returns (FolderInfo);
  rpc GetFolderKeys(GetFolderKeysRequest) returns (GetFolderKeysResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc DumpIndex(DumpIndexRequest) returns (stream IndexEntry);
  rpc WatchMetrics(StatusRequest) returns (stream ControlMetrics);
  rpc RemoveFolder(FolderRequest) returns (OperationResult);
  rpc PauseFolder(FolderRequest) returns (FolderInfo);
  rpc ResumeFolder(FolderRequest) returns (FolderInfo);
  rpc PauseAll(PauseAllRequest) returns (OperationResult);
  rpc ListPendingDevices(StatusRequest) returns (ListPendingDevicesResponse);
  rpc ApproveDevice(DeviceActionRequest) returns (OperationResult);
  rpc DenyDevice(DeviceActionRequest) returns (OperationResult);
  rpc BlockDevice(DeviceActionRequest) returns (OperationResult);
  rpc GetFolderSettings(FolderRequest) returns (SettingsResponse);
  rpc UpdateFolderSettings(UpdateFolderSettingsRequest) returns (SettingsResponse);
  rpc GetIgnoreRules(FolderRequest) returns (IgnoreRulesResponse);
  rpc SetIgnoreRules(SetIgnoreRulesRequest) returns (IgnoreRulesResponse);
  rpc GetSettings(StatusRequest) returns (SettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (SettingsResponse);
  rpc ListOverwritten(FolderRequest) returns (ListArchiveResponse);
  rpc RestoreOverwritten(RestoreArchiveRequest) returns (OperationResult);
  rpc ListArchive(FolderRequest) returns (ListArchiveResponse);
  rpc RestoreArchived(RestoreArchiveRequest) returns (OperationResult);
  rpc AuthorizeUser(AuthorizeUserRequest) returns (OperationResult);
}

message StatusRequest {}
message ControlEvent {
  ServiceStatus status = 1;
  bool full_snapshot = 2;
  repeated FolderInfo folders = 3;
  repeated FolderPeerInfo peers = 4;
  repeated ArchiveInfo overwrites = 5;
  repeated ControlError errors = 6;
  bool truncated = 7;
  repeated PendingDeviceInfo pending_devices = 8;
  repeated ControlTransferProgress progress = 9;
}
message ControlError { string code = 1; string source = 2; int64 occurred_utc_ticks = 3; }
message ControlTransferProgress {
  string folder_id = 1;
  uint64 uploaded_bytes = 2;
  uint64 downloaded_bytes = 3;
}
message ControlMetrics {
  string instance_id = 1;
  uint64 sequence = 2;
  int64 sampled_utc_ticks = 3;
  uint32 active_peer_sessions = 4;
  uint32 active_folders = 5;
  uint32 pending_devices = 6;
  uint64 upload_bytes_per_second = 7;
  uint64 download_bytes_per_second = 8;
  // Requests waiting for per-peer transfer-window capacity.
  uint32 queue_depth = 9;
  uint64 hashing_bytes_per_second = 10;
  bool transfer_metrics_available = 11;
}
message ListFoldersRequest {}
message SetPredefinedHostsRequest { string folder = 1; repeated string hosts = 2; }
message SetPredefinedHostsResponse { string folder_id = 1; repeated string hosts = 2; }
message FolderInfo {
  string folder_id = 1;
  string path = 2;
  string access = 3;
  bool paused = 4;
}
message ListFoldersResponse { repeated FolderInfo folders = 1; }
message AddFolderRequest { string path = 1; }
message JoinFolderRequest { string key = 1; string path = 2; }
message GetFolderKeysRequest { string folder = 1; }
message GetFolderKeysResponse { string folder_id = 1; string access = 2; string key = 3; }
message ListPeersRequest { string folder = 1; }
message PeerInfo {
  string device_id = 1;
  string name = 2;
  string approval = 3;
  bool pinned = 4;
  optional int64 last_seen_utc_ticks = 5;
  string transport = 6;
}
message ListPeersResponse { string folder_id = 1; repeated PeerInfo peers = 2; }
message FolderPeerInfo { string folder_id = 1; PeerInfo peer = 2; }
message DumpIndexRequest { string folder = 1; }
message IndexEntry {
  string path = 1;
  int64 size = 2;
  int64 modified_utc_ticks = 3;
  bool deleted = 4;
}
message FolderRequest { string folder = 1; }
message OperationResult { bool completed = 1; string detail = 2; }
message PauseAllRequest { int64 duration_seconds = 1; }
message DeviceActionRequest { string folder = 1; string device_id = 2; }
message PendingDeviceInfo { string folder_id = 1; string device_id = 2; string name = 3; int64 requested_utc_ticks = 4; }
message ListPendingDevicesResponse { repeated PendingDeviceInfo devices = 1; bool truncated = 2; }
message SettingsResponse { string json = 1; bool restart_required = 2; }
message UpdateFolderSettingsRequest { string folder = 1; string json = 2; }
message UpdateSettingsRequest { string json = 1; }
message IgnoreRulesResponse { string folder_id = 1; string rules = 2; bool restart_required = 3; }
message SetIgnoreRulesRequest { string folder = 1; string rules = 2; }
message ArchiveInfo {
  int64 id = 1;
  string original_path = 2;
  int64 archived_utc_ticks = 3;
  int64 size = 4;
  bool overwritten = 5;
  string folder_id = 6;
}
message ListArchiveResponse { string folder_id = 1; repeated ArchiveInfo versions = 2; bool truncated = 3; }
message RestoreArchiveRequest { string folder = 1; int64 archive_id = 2; bool as_copy = 3; string copy_path = 4; }
message AuthorizeUserRequest { string sid = 1; }

message ServiceStatus {
  // Canonical Guid N format. Sequence is scoped to this service instance.
  string instance_id = 1;
  uint64 sequence = 2;
  bool production_sync_available = 3;
  repeated PeerSessionClockStatus clocks = 4;
  bool clock_status_truncated = 5;
}

enum ClockState {
  CLOCK_STATE_UNSPECIFIED = 0;
  CLOCK_STATE_AWAITING_HELLO = 1;
  CLOCK_STATE_ACCEPTED = 2;
  CLOCK_STATE_SKEWED = 3;
  CLOCK_STATE_INVALID_TIMESTAMP = 4;
  CLOCK_STATE_INVALID_ELAPSED = 5;
}

message PeerSessionClockStatus {
  bytes folder_id = 1;
  bytes device_id = 2;
  string session_id = 3;
  ClockState state = 4;
  // Present for an evaluated accepted/skewed sample, including exact zero.
  optional sint64 offset_ticks = 5;
  bool is_connected = 6;
}
